<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJUNJU ELECTRONICS - Cloud Management Portal v6.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo-area h1 {
            color: #38bdf8;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .select-style, .input-style {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .select-style:focus, .input-style:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #0369a1;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-area">
        <h1>NJUNJU ELECTRONICS</h1>
        <p>Cloud Management Portal v6.2</p>
    </div>

    <form>
        <div class="form-group">
            <label for="role">Username (Nafasi yako)</label>
            <select id="role" class="select-style">
                <option value="" disabled selected>Chagua nafasi yako...</option>
                <option value="staff">Staff (Wafanyakazi)</option>
                <option value="admin">Admin (Mkurugenzi)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Nywila ya Usalama (Password)</label>
            <input type="password" id="password" class="input-style" placeholder="Weka password yako...">
        </div>

        <button type="submit" class="btn-login">
            🔓 Fungua Mfumo
        </button>
    </form>

    <div class="footer-text">
        NJUNJU ELECTRONICS © 2026 | We lift your smartlife.
    </div>
</div>

</body>
</html>
